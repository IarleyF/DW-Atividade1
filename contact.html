<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact</title>
</head>
<body>
    <div class = "menu-site">
        <a href="index.html"><h1>Página Inicial</h1></a>
        <a href="about.html"><h1>About</h1></a>
        <a href="contact.html"><h1>Contact</h1></a>
    </div>

    <div class="formulario-contato">
        <h1>Formulário para passeio turístico</h1>
        <form>
            <div class="campo-grupo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">
            </div>
            <div class="campo-grupo">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="campo-grupo">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone">
            </div>

            <div class="campo-data">
                <label for="data-nasc">Data de Nascimento:</label>
                <input type="date" id="data-nasc" name="data-nasc">
            </div>

            <div class="campo-checkbox">
                <label for="lugares-visita">Lugares que desejo visitar:</label>
                <div>
                    <input type="checkbox" id="hotel-casa-mar" name="hotel-casa-mar">
                    <label for="hotel-casa-mar">Hotel Casa do Mar</label>
                </div>
                <div>
                    <input type="checkbox" id="praia-peroba" name="praia-peroba">
                    <label for="praia-peroba">Praia de Peroba</label>
                </div>
            </div>

            <div class="campo-grupo">
                <label for="qtd-pessoas">N° de pessoas:</label>
                <input type="number" id="qtd-pessoas" name="qtd-pessoas" min="1" max="10">
            </div>

            <div class="botao-enviar">
            <button type="submit">Enviar</button>
            </div>
        </form>
    </div>
</body>
</html>
